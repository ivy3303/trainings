<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treningi</title>
<style>
  /* Palette taken from the gym floor: concrete, chalk, iron and the colour-coded weight plates. */
  :root {
    color-scheme: dark;
    --bg: #1d2228;          /* graphite */
    --card: #272e36;
    --raised: #313a45;
    --field: #1a1f25;
    --line: #444f5c;
    --text: #eef1f4;
    --muted: #a6b1be;
    --blue: #7fa6f5;        /* links and small controls */
    --blue-btn: #3b6fd8;    /* main button */
    --blue-btn-edge: #25489a;
    --blue-soft: #2b3f63;
    --green: #4fd09a;
    --green-soft: #1f4636;
    --red: #f0746c;
    --red-soft: #4a2528;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; padding: 0 12px 110px; }

  .masthead {
    position: relative;
    margin: 0 -12px 16px;
    padding: 18px 16px 20px;
    background: #14181d;
    color: #fff;
    overflow: hidden;
  }
  .masthead::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: var(--blue-btn);
  }
  .masthead h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
  @media (min-width: 745px) { .masthead { margin: 12px 0 16px; border-radius: 16px; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 12px;
    margin-bottom: 14px;
    box-shadow: 0 8px 18px -12px rgba(0, 0, 0, 0.6);
  }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select {
    width: 100%;
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 12px;
    height: 48px;
    font: inherit;
    font-size: 1rem; /* 16px: stops mobile browsers from zooming in on focus */
  }
  textarea { height: auto; min-height: 72px; padding: 10px 12px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; font-variant-numeric: tabular-nums; }
  button {
    font: inherit;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    background: var(--line);
    touch-action: manipulation; /* fast repeated taps on + / − without double-tap zoom */
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .hidden { display: none; }

  /* top card */
  .top-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .link-btn {
    background: transparent;
    color: var(--blue);
    padding: 0;
    height: 40px;
    text-align: left;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .hint { margin: 6px 0 0; font-size: 0.85rem; color: var(--muted); }

  /* exercise */
  .exercise { border-left: 6px solid var(--gc, var(--line)); }
  .groups { display: grid; grid-template-columns: auto repeat(5, 1fr); gap: 6px; align-items: center; margin-bottom: 10px; }
  .groups-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); padding-right: 2px; }
  .group-chip { height: 40px; padding: 0; font-weight: 800; background: transparent; border: 1.5px solid var(--c); color: var(--c); }
  .group-chip.on { background: var(--c); color: #1d2228; }
  .exercise-head { display: grid; grid-template-columns: 1fr 44px; gap: 8px; margin-bottom: 8px; }
  .exercise-head .name { font-weight: 700; font-size: 1.05rem; }
  .remove-exercise { background: transparent; color: var(--muted); font-size: 1.1rem; }
  .remove-exercise:active { color: var(--red); }
  .prev { margin: 0 0 10px; font-size: 0.9rem; color: var(--muted); }
  .prev:empty { display: none; }
  .prev .up { color: var(--green); font-weight: 700; }
  .prev .down { color: var(--red); font-weight: 700; }
  .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 10px; padding: 4px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; }
  .segmented button { height: 38px; background: transparent; color: var(--muted); }
  .segmented button.on { background: var(--blue-soft); color: #cfe0ff; font-weight: 700; }

  /* one set = one tile; its plate badge follows the colours of real weight plates */
  .sets { display: grid; gap: 10px; }
  .set { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 10px 8px; }
  .set-head { display: grid; grid-template-columns: minmax(0, 1fr) 46px; align-items: center; margin-bottom: 2px; }
  .set-head .num { font-size: 1rem; color: var(--text); }
  .plate {
    display: inline-block;
    width: 20px;
    height: 20px;
    margin-right: 8px;
    vertical-align: -4px;
    border-radius: 50%;
    --pc: #8fa0b5;
    background: radial-gradient(circle, var(--raised) 0 2.5px, var(--pc) 3px);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  }
  .field + .field { margin-top: 8px; }
  .field-title { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin: 0 0 4px 2px; }
  .field-row { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 6px; align-items: center; }
  .remove-set { width: 46px; height: 36px; padding: 0; background: transparent; color: var(--muted); font-size: 1.2rem; }
  .remove-set:active { color: var(--red); }
  .remove-set:disabled { visibility: hidden; }
  .bw {
    width: 46px;
    height: 52px;
    padding: 0;
    font-size: 0.9rem;
    font-weight: 800;
    background: var(--field);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .bw.on { background: var(--blue-btn); border-color: var(--blue-btn); color: #fff; }
  .num-field { display: flex; gap: 3px; }
  .num-field input {
    min-width: 0;
    height: 52px;
    padding: 0 2px;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
  }
  .num-field input:disabled { background: #22282f; color: var(--muted); }
  .num-field input.main.more { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .num-field input.main.less { background: var(--red-soft); border-color: var(--red); color: #ffb4ae; }
  .num-field .step {
    flex: 0 0 40px;
    height: 52px;
    padding: 0;
    font-size: 1.5rem;
    line-height: 1;
    background: var(--blue-soft);
    border: 1px solid #3d5683;
    color: #fff;
  }
  .num-field.disabled .step { opacity: 0.35; pointer-events: none; }

  .set-actions { display: block; margin-top: 10px; }
  .set-actions button {
    width: 100%;
    height: 48px;
    background: var(--field);
    border: 1.5px dashed #56698a;
    color: var(--blue);
    font-weight: 700;
  }
  .note-field { margin-top: 4px; }
  .add-exercise { width: 100%; height: 54px; margin-bottom: 14px; background: var(--card); border: 1.5px dashed #56698a; color: var(--blue); font-weight: 700; }

  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 16px -10px rgba(0, 0, 0, 0.7);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 720px; margin: 0 auto; }
  .primary { width: 100%; height: 54px; background: #25458a; color: #fff; font-weight: 800; font-size: 1.05rem; box-shadow: 0 3px 0 #162c58; }
  .primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #162c58; }

  .notice { padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; font-size: 0.9rem; display: none; }
  .notice.show { display: block; }
  .notice.warn { background: var(--blue-soft); color: #cfe0ff; }
  .notice.ok { background: var(--green-soft); color: var(--green); }
  .notice.err { background: var(--red-soft); color: #ffb4ae; }

  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>Treningi</h1>
  </header>

  <div id="configWarning" class="notice warn">
    Brak adresu skryptu Google. Wklej adres aplikacji internetowej Apps Script do stałej
    <code>SCRIPT_URL</code> w pliku index.html, żeby zapisywanie i wczytywanie działało.
  </div>
  <div id="status" class="notice" role="status"></div>

  <form id="form" autocomplete="off">
    <div class="card">
      <div class="top-row">
        <div>
          <label for="training">Trening</label>
          <select id="training"></select>
        </div>
        <div>
          <label for="date">Data</label>
          <input id="date" type="date" required>
        </div>
      </div>
      <div id="newNameBox" class="hidden" style="margin-bottom:10px">
        <label for="newName">Nazwa nowego treningu (nazwa zakładki w arkuszu)</label>
        <input id="newName" type="text" placeholder="np. FBW A, Push, Nogi">
      </div>
      <button type="button" class="link-btn" id="showNotes">+ Notatka do całego treningu</button>
      <div id="notesBox" class="hidden">
        <label for="notes">Notatka do całego treningu</label>
        <textarea id="notes" placeholder="Samopoczucie, ogólne wrażenia, plan na następny raz…"></textarea>
      </div>
      <p class="hint" id="lastInfo"></p>
    </div>

    <div id="exercises"></div>
    <datalist id="exerciseNames"></datalist>

    <button type="button" id="addExercise" class="add-exercise">+ Dodaj ćwiczenie</button>

    <div class="bar">
      <div class="bar-inner">
        <button type="submit" class="primary" id="submit">Zapisz trening</button>
      </div>
    </div>
  </form>
</main>

<script>
  // Address of the Google Apps Script web app (see apps-script/Code.gs).
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx10vXJ1YhC_JBdEa6_6YujkQnQs4NI73sdJOsoXZ8-Ccu92L7n6gzIubjqxbBd0rVw/exec';

  // Must match VERSION in apps-script/Code.gs.
  const EXPECTED_SCRIPT_VERSION = 4;

  // Training blocks as numbered in the plan (A0, B1, C2a …) and their pastel colours.
  const GROUPS = ['A', 'B', 'C', 'D', 'E'];
  const GROUP_COLORS = { A: '#9fdcc3', B: '#f6c796', C: '#a9c6f4', D: '#e3b0ea', E: '#f1df8e' };

  const NEW_VALUE = '__new__';
  const LAST_SELECTED_KEY = 'trainings.lastSelected';

  // Step of the − / + buttons.
  const STEP = { reps: 1, time: 5, weight: 2.5 };

  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const trainingSelect = $('training');
  const exercisesEl = $('exercises');
  const submitBtn = $('submit');

  // trainings = [{ name, lastDate, exercises: [{ name, mode, note, sets: [{ reps, seconds, weight }] }] }]
  // weight is a number (kg), 'BW' or null.
  let trainings = [];

  const isConfigured = () => !SCRIPT_URL.startsWith('PASTE_');
  const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD in local time

  function showStatus(kind, text) {
    const el = $('status');
    el.className = 'notice show ' + kind;
    el.textContent = text;
  }

  function currentTraining() {
    return trainings.find((t) => t.name === trainingSelect.value) || null;
  }

  function isNewTraining() {
    return trainingSelect.value === NEW_VALUE;
  }

  function round(n) { return Math.round(n * 100) / 100; }
  function formatNumber(n) { return round(n).toLocaleString('pl-PL'); }

  function formatTime(seconds) {
    if (seconds < 60) return seconds + '"';
    const minutes = Math.floor(seconds / 60);
    const rest = seconds % 60;
    return minutes + "'" + (rest ? String(rest).padStart(2, '0') + '"' : '');
  }

  // ---------- loading ----------

  async function loadTrainings() {
    if (!isConfigured()) { trainings = []; return; }
    let result;
    try {
      const response = await fetch(SCRIPT_URL + '?action=list');
      result = await response.json();
    } catch (error) {
      throw new Error('brak poprawnej odpowiedzi ze skryptu Google. Sprawdź, czy wdrożenie ma dostęp „Każdy” i czy zatwierdzono uprawnienia skryptu.');
    }
    if (!result.ok) throw new Error(result.error || 'nieznany błąd skryptu.');
    if (result.version !== EXPECTED_SCRIPT_VERSION || !Array.isArray(result.trainings)) {
      throw new Error('wdrożony skrypt Google jest w starej wersji, dlatego serie nie mogą się wczytać. Wklej najnowszy Code.gs i wdróż go jako nową wersję (Wdróż → Zarządzaj wdrożeniami → Edytuj → Nowa wersja).');
    }
    trainings = result.trainings;
  }

  function renderTrainingSelect(selectedName) {
    trainingSelect.innerHTML = '';
    trainings.forEach((t) => {
      const option = document.createElement('option');
      option.value = t.name;
      option.textContent = t.name;
      trainingSelect.appendChild(option);
    });
    const newOption = document.createElement('option');
    newOption.value = NEW_VALUE;
    newOption.textContent = '➕ Nowy trening…';
    trainingSelect.appendChild(newOption);

    const known = trainings.some((t) => t.name === selectedName);
    trainingSelect.value = known ? selectedName : (trainings.length ? trainings[0].name : NEW_VALUE);

    // Suggestions for exercise names come from every training in the sheet.
    const names = new Set();
    trainings.forEach((t) => t.exercises.forEach((e) => names.add(e.name)));
    const list = $('exerciseNames');
    list.innerHTML = '';
    [...names].sort().forEach((n) => {
      const option = document.createElement('option');
      option.value = n;
      list.appendChild(option);
    });
  }

  // ---------- exercises and sets ----------

  function findPrevious(name) {
    const training = currentTraining();
    if (!training || !name) return null;
    const key = name.trim().toLowerCase();
    return training.exercises.find((e) => e.name.toLowerCase() === key) || null;
  }

  function numberField(cls, step, min, extra) {
    return '<div class="num-field">' +
      '<button type="button" class="step" data-dir="-1" tabindex="-1" aria-label="Mniej">−</button>' +
      '<input type="number" class="' + cls + '" inputmode="decimal" min="' + min + '" step="any" data-step="' + step + '" data-min="' + min + '">' +
      '<button type="button" class="step" data-dir="1" tabindex="-1" aria-label="Więcej">+</button>' +
      (extra || '') +
      '</div>';
  }

  function modeOf(card) {
    return card.dataset.mode; // 'reps' | 'time'
  }

  function mainLabel(timed) {
    return timed ? 'Czas (s)' : 'Powtórzenia';
  }

  function applyMode(card) {
    const timed = modeOf(card) === 'time';
    card.querySelectorAll('.segmented button').forEach((b) => {
      b.classList.toggle('on', b.dataset.mode === modeOf(card));
    });
    card.querySelectorAll('.main-label').forEach((el) => { el.textContent = mainLabel(timed); });
    card.querySelectorAll('.set .main').forEach((input) => {
      input.dataset.step = timed ? STEP.time : STEP.reps;
    });
  }

  function applyGroup(card, group) {
    const known = GROUPS.includes(group) ? group : '';
    card.dataset.group = known;
    card.style.setProperty('--gc', known ? GROUP_COLORS[known] : 'var(--line)');
    card.querySelectorAll('.group-chip').forEach((chip) => {
      chip.classList.toggle('on', chip.dataset.group === known);
      chip.setAttribute('aria-pressed', chip.dataset.group === known ? 'true' : 'false');
    });
  }

  function renumber(card) {
    const rows = card.querySelectorAll('.set');
    rows.forEach((row, i) => {
      row.querySelector('.num').innerHTML = '<span class="plate"></span>Seria ' + (i + 1);
    });
    rows.forEach((row) => { row.querySelector('.remove-set').disabled = rows.length <= 1; });
  }

  function setBodyweight(row, on) {
    const input = row.querySelector('.weight');
    const button = row.querySelector('.bw');
    row.dataset.bw = on ? '1' : '';
    button.classList.toggle('on', on);
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
    row.querySelector('.weight-field .num-field').classList.toggle('disabled', on);
    input.disabled = on;
    if (on) input.value = '';
    input.placeholder = on ? 'BW' : 'kg';
  }

  function createSet(card, data) {
    const timed = modeOf(card) === 'time';
    const row = document.createElement('div');
    row.className = 'set';
    row.innerHTML =
      '<div class="set-head">' +
        '<b class="num"></b>' +
        '<button type="button" class="remove-set" title="Usuń serię" aria-label="Usuń serię">✕</button>' +
      '</div>' +
      '<div class="field">' +
        '<div class="field-title main-label"></div>' +
        '<div class="field-row">' + numberField('main', timed ? STEP.time : STEP.reps, 1) + '<span></span></div>' +
      '</div>' +
      '<div class="field">' +
        '<div class="field-title">Ciężar (kg)</div>' +
        '<div class="field-row">' +
          '<div class="weight-field">' + numberField('weight', STEP.weight, 0) + '</div>' +
          '<button type="button" class="bw" aria-pressed="false">BW</button>' +
        '</div>' +
      '</div>';
    const main = row.querySelector('.main');
    main.placeholder = timed ? 'sek.' : 'powt.';
    row.querySelector('.weight').placeholder = 'kg';
    row.querySelector('.main-label').textContent = mainLabel(timed);
    if (data) {
      const value = timed ? data.seconds : data.reps;
      main.value = value ? value : '';
      // No kilograms recorded means bodyweight.
      const noWeight = data.weight === null || data.weight === undefined || data.weight === '';
      if (data.weight === 'BW' || noWeight) setBodyweight(row, true);
      else row.querySelector('.weight').value = data.weight;
    }
    card.querySelector('.sets').appendChild(row);
    renumber(card);
  }

  function createExercise(data) {
    const card = document.createElement('div');
    card.className = 'card exercise';
    card.dataset.mode = data && data.mode === 'time' ? 'time' : 'reps';
    card.innerHTML =
      '<div class="exercise-head">' +
        '<input type="text" class="name" list="exerciseNames" placeholder="Nazwa ćwiczenia">' +
        '<button type="button" class="remove-exercise" title="Pomiń to ćwiczenie" aria-label="Pomiń to ćwiczenie">✕</button>' +
      '</div>' +
      '<div class="groups" role="group" aria-label="Blok ćwiczenia"><span class="groups-label">Blok</span>' +
        GROUPS.map((g) => '<button type="button" class="group-chip" data-group="' + g + '" style="--c:' + GROUP_COLORS[g] + '">' + g + '</button>').join('') +
      '</div>' +
      '<p class="prev"></p>' +
      '<div class="segmented">' +
        '<button type="button" data-mode="reps">Powtórzenia</button>' +
        '<button type="button" data-mode="time">Czas</button>' +
      '</div>' +
      '<div class="sets"></div>' +
      '<div class="set-actions">' +
        '<button type="button" class="add-set">+ Seria</button>' +
      '</div>' +
      '<button type="button" class="link-btn note-toggle">+ Uwaga do ćwiczenia</button>' +
      '<div class="note-field hidden"><input type="text" class="note-input" placeholder="np. ostatnia seria ciężko, zwiększyć ciężar"></div>';

    card.querySelector('.name').value = (data && data.name) || '';
    applyMode(card);
    applyGroup(card, data && data.group);

    card.querySelector('.remove-exercise').addEventListener('click', () => {
      card.remove();
      refresh();
    });
    card.querySelector('.add-set').addEventListener('click', () => {
      // A new set starts with the values of the previous one, so only changes need tapping.
      const rows = card.querySelectorAll('.set');
      const last = rows[rows.length - 1];
      if (last) {
        const timed = modeOf(card) === 'time';
        const main = last.querySelector('.main').value;
        const weight = last.dataset.bw ? 'BW' : last.querySelector('.weight').value;
        createSet(card, {
          reps: timed ? 0 : Number(main),
          seconds: timed ? Number(main) : 0,
          weight: weight === 'BW' ? 'BW' : (weight === '' ? null : Number(weight))
        });
      } else {
        createSet(card, null);
      }
      refresh();
    });
    card.querySelector('.sets').addEventListener('click', (event) => {
      const button = event.target.closest('.remove-set');
      if (!button || card.querySelectorAll('.set').length <= 1) return;
      button.closest('.set').remove();
      renumber(card);
      refresh();
    });

    const sets = data && data.sets && data.sets.length ? data.sets : [null];
    sets.forEach((s) => createSet(card, s));
    exercisesEl.appendChild(card);
    return card;
  }

  function readCard(card) {
    const read = (el) => (el.value === '' ? NaN : Number(el.value));
    const sets = [];
    card.querySelectorAll('.set').forEach((row) => {
      sets.push({
        value: read(row.querySelector('.main')),
        weight: row.dataset.bw ? 'BW' : read(row.querySelector('.weight'))
      });
    });
    return {
      name: card.querySelector('.name').value.trim(),
      mode: modeOf(card),
      group: card.dataset.group || '',
      note: card.querySelector('.note-input').value.trim(),
      sets
    };
  }

  // Previous sets in the same shape as readCard: { value, weight } (weight NaN = none).
  function previousSets(previous) {
    return previous.sets.map((s) => ({
      value: previous.mode === 'time' ? s.seconds : s.reps,
      weight: s.weight === null || s.weight === undefined ? NaN : s.weight
    }));
  }

  function describeSets(previous) {
    const sets = previousSets(previous);
    const groups = [];
    sets.forEach((s) => {
      const last = groups[groups.length - 1];
      if (last && last.value === s.value && Object.is(last.weight, s.weight)) last.count += 1;
      else groups.push({ value: s.value, weight: s.weight, count: 1 });
    });
    return groups.map((g) => {
      let text = previous.mode === 'time' ? formatTime(g.value) : String(g.value);
      if (g.weight === 'BW') text += ' × BW';
      else if (!Number.isNaN(g.weight) && g.weight > 0) text += ' × ' + formatNumber(g.weight) + ' kg';
      return (g.count > 1 ? g.count + ' × ' : '') + text;
    }).join(' · ');
  }

  function summarize(mode, sets) {
    let top = 0;
    let total = 0;
    sets.forEach((s) => {
      if (typeof s.weight === 'number' && !Number.isNaN(s.weight)) top = Math.max(top, s.weight);
      if (!Number.isNaN(s.value)) total += s.value;
    });
    return { mode, top, total, count: sets.length };
  }

  function diffParts(before, now) {
    const parts = [{ diff: round(now.top - before.top), unit: 'kg' }];
    if (before.mode === now.mode) parts.push({ diff: round(now.total - before.total), unit: now.mode === 'time' ? 's' : 'powt.' });
    parts.push({ diff: round(now.count - before.count), unit: 'serii' });
    return parts.filter((p) => p.diff !== 0);
  }

  // Green when a set has more reps/seconds than the same set last time, red when fewer.
  function markChanges(card, previous) {
    const comparable = previous && previous.mode === modeOf(card);
    card.querySelectorAll('.set').forEach((row, i) => {
      const input = row.querySelector('.main');
      const before = comparable && previous.sets[i] ? (previous.mode === 'time' ? previous.sets[i].seconds : previous.sets[i].reps) : null;
      const now = input.value === '' ? NaN : Number(input.value);
      input.classList.toggle('more', Boolean(before) && now > before);
      input.classList.toggle('less', Boolean(before) && now < before);
    });
  }

  function updateCard(card) {
    const current = readCard(card);
    const previous = findPrevious(current.name);
    markChanges(card, previous);
    const hint = card.querySelector('.prev');
    hint.textContent = '';


    if (!previous) {
      if (!isNewTraining() && current.name) hint.textContent = 'Nowe ćwiczenie w tym treningu — brak wcześniejszych wyników.';
      return;
    }

    hint.append('Poprzednio: ' + describeSets(previous));
    const validSets = current.sets.filter((s) => !Number.isNaN(s.value));
    if (validSets.length) {
      const parts = diffParts(summarize(previous.mode, previousSets(previous)), summarize(current.mode, validSets));
      const result = document.createElement('span');
      if (!parts.length) {
        result.textContent = ' · bez zmian';
      } else {
        result.className = parts[0].diff > 0 ? 'up' : 'down';
        result.textContent = ' ' + (parts[0].diff > 0 ? '▲ ' : '▼ ') + parts.map((p) => (p.diff > 0 ? '+' : '') + formatNumber(p.diff) + ' ' + p.unit).join(', ');
      }
      hint.appendChild(result);
    }
    if (previous.note) {
      hint.appendChild(document.createElement('br'));
      hint.append('Poprzednia uwaga: ' + previous.note);
    }
  }

  function renderExercises() {
    exercisesEl.innerHTML = '';
    const training = currentTraining();
    $('newNameBox').classList.toggle('hidden', !isNewTraining());
    if (training) {
      training.exercises.forEach(createExercise);
      $('lastInfo').textContent = training.lastDate
        ? 'Wyniki z ostatniego treningu (' + training.lastDate + '). Zmień to, co poszło inaczej.'
        : 'Ten trening nie ma jeszcze żadnych wpisów.';
    } else {
      createExercise();
      $('lastInfo').textContent = trainings.length || !isConfigured()
        ? 'Nowy trening: pierwszy zapis stworzy nową zakładkę.'
        : 'Nie znaleziono żadnych treningów w arkuszu. Jeśli powinny tu być, sprawdź wdrożenie skryptu Google.';
    }
    refresh();
  }

  function refresh() {
    exercisesEl.querySelectorAll('.exercise').forEach(updateCard);
  }

  // ---------- saving ----------

  function collectValid() {
    const valid = [];
    exercisesEl.querySelectorAll('.exercise').forEach((card) => {
      const c = readCard(card);
      const sets = c.sets
        .filter((s) => s.value > 0)
        .map((s) => ({
          reps: c.mode === 'reps' ? s.value : null,
          seconds: c.mode === 'time' ? s.value : null,
          weight: s.weight === 'BW' || Number.isNaN(s.weight) ? 'BW' : s.weight // empty kilograms = bodyweight
        }));
      if (c.name && sets.length) valid.push({ name: c.name, mode: c.mode, group: c.group, note: c.note, sets });
    });
    return valid;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!isConfigured()) { showStatus('err', 'Najpierw wklej adres skryptu Google do SCRIPT_URL w index.html.'); return; }

    const creating = isNewTraining();
    const training = creating ? $('newName').value.trim() : trainingSelect.value;
    if (!training) { showStatus('err', 'Podaj nazwę nowego treningu.'); return; }
    if (creating && trainings.some((t) => t.name.toLowerCase() === training.toLowerCase())) {
      showStatus('err', 'Trening o tej nazwie już istnieje — wybierz go z listy.');
      return;
    }
    if (!$('date').value) { showStatus('err', 'Wybierz datę.'); return; }
    const exercises = collectValid();
    if (!exercises.length) { showStatus('err', 'Dodaj co najmniej jedno ćwiczenie z nazwą i serią (powtórzenia lub czas).'); return; }

    submitBtn.disabled = true;
    showStatus('warn', 'Zapisuję…');
    try {
      // A plain-text body keeps this a "simple" request, so Apps Script needs no CORS preflight.
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          training,
          create: creating,
          date: $('date').value,
          notes: $('notes').value.trim(),
          exercises
        })
      });
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || 'Nieznany błąd skryptu.');

      try { await loadTrainings(); } catch (error) { /* saved anyway; keep the previous list */ }
      renderTrainingSelect(result.sheet);
      try { localStorage.setItem(LAST_SELECTED_KEY, trainingSelect.value); } catch (e) {}
      $('notes').value = '';
      $('notesBox').classList.add('hidden');
      $('showNotes').classList.remove('hidden');
      $('newName').value = '';
      $('date').value = today();
      renderExercises();
      showStatus('ok', 'Zapisano w zakładce „' + result.sheet + '” (' + exercises.length + ' ćw.).');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (error) {
      showStatus('err', 'Nie udało się zapisać: ' + error.message + ' Dane zostały na stronie, spróbuj ponownie.');
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- wiring ----------

  trainingSelect.addEventListener('change', () => {
    try { localStorage.setItem(LAST_SELECTED_KEY, trainingSelect.value); } catch (e) {}
    renderExercises();
  });
  form.addEventListener('input', refresh);

  $('showNotes').addEventListener('click', (event) => {
    event.currentTarget.classList.add('hidden');
    $('notesBox').classList.remove('hidden');
    $('notes').focus();
  });

  exercisesEl.addEventListener('click', (event) => {
    const target = event.target;

    const chip = target.closest('.group-chip');
    if (chip) {
      const card = chip.closest('.exercise');
      applyGroup(card, card.dataset.group === chip.dataset.group ? '' : chip.dataset.group);
      return;
    }

    const modeButton = target.closest('.segmented button');
    if (modeButton) {
      const card = modeButton.closest('.exercise');
      card.dataset.mode = modeButton.dataset.mode;
      applyMode(card);
      refresh();
      return;
    }

    const noteToggle = target.closest('.note-toggle');
    if (noteToggle) {
      const card = noteToggle.closest('.exercise');
      noteToggle.classList.add('hidden');
      card.querySelector('.note-field').classList.remove('hidden');
      card.querySelector('.note-input').focus();
      return;
    }

    const bw = target.closest('.bw');
    if (bw) {
      const row = bw.closest('.set');
      setBodyweight(row, !row.dataset.bw);
      refresh();
      return;
    }

    const step = target.closest('.step');
    if (step) {
      const input = step.parentElement.querySelector('input');
      if (input.disabled) return;
      const current = input.value === '' ? 0 : Number(input.value);
      const next = round(current + Number(input.dataset.step) * Number(step.dataset.dir));
      input.value = Math.max(Number(input.dataset.min), next);
      refresh();
    }
  });

  $('addExercise').addEventListener('click', () => { createExercise(); refresh(); });

  async function init() {
    $('date').value = today();
    if (!isConfigured()) $('configWarning').classList.add('show');
    try {
      showStatus('warn', 'Wczytuję treningi…');
      await loadTrainings();
      $('status').className = 'notice';
    } catch (error) {
      trainings = [];
      showStatus('err', 'Nie udało się wczytać ostatniego treningu: ' + error.message);
    }
    let remembered = null;
    try { remembered = localStorage.getItem(LAST_SELECTED_KEY); } catch (e) {}
    renderTrainingSelect(remembered);
    renderExercises();
  }

  init();
</script>
</body>
</html>
